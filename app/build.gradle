plugins {
    id 'com.android.application'
}

android {
    namespace 'com.dsb.xp'
    compileSdk 36

    defaultConfig {
        applicationId 'com.dsb.xp'
        minSdk 26
        targetSdk 36
        versionCode 2
        versionName '2.0'
    }

    buildTypes {
        release {
            minifyEnabled false
            // 直接用 debug 签名，省去自建密钥库；模块自用足够
            signingConfig signingConfigs.debug
        }
    }

    // libxposed API 的 class 文件是 Java 17 版本，所以这里必须 >= 17
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}

dependencies {
    // 只在编译期需要；运行时由 LSPosed 提供
    compileOnly 'io.github.libxposed:api:101.0.0'
}
